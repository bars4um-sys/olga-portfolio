bio_lead: "Мне 22 года и я — уже мультидисциплинарный специалист. Успела попробовать несколько направлений и продолжаю развивать свои навыки."

bio:
  - "Окончила МКИК по специальности «Издательское дело и журналистика». Прошла курс «Интернет-маркетинг» в Академии Эдисон. За три года в медиа отсмотрела 400+ телепроектов, верстала книги, зины и фото-книги, создавала промо-материалы для крупного издательства, выступала на радио и писала тексты, которые читают."
  - "Хожу на лекции по искусству, в музеи, театры, кино, слушаю большинство жанров в музыке и читаю разную литературу. Постоянно узнаю что-то новое в творческой среде, слежу за трендами. Люблю креативить, создавать новое и переосмыслять уже существующее с уважением к традициям."

