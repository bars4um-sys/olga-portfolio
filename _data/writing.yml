- tag: "Эссе"
  title: "Любовь в литературе и жизни"
  excerpt: "О видах любви в мифах Древней Греции — от эроса до агапэ. Почему в разном времени любовь всегда немного отличается, но по сути остаётся одинаковой."
  body: |
    <p><strong>Почему в разном времени любовь всегда немного отличается, но по сути своей остаётся одинаковой?</strong></p>
    <p>В последнее время люди чересчур часто стали использовать слово «любовь» в своей речи и его красивое значение немного поблекло. Она стала чем-то бытовым и обыденным. Но в литературе до сих пор прячется та самая чистая любовь, которой так ждут подростки и разбиваются о ту самую обыденность. Почему в литературном мире оно выглядит по-другому? Из-за чего могли создаться такие стереотипы?</p>
    <p>Древняя Греция задаёт как обычно задаёт начало. Почти во всех мифах так или иначе встречается любовь. Иногда это филео, иногда даже агапэ, но чаще всего всё-таки это эрос. Греки не зря придумали целых семь слов, обозначающих любовь. Они были людьми достаточно страстными, но всё же старались различать это влечение и страсть от глубокой любви.</p>
    <p>В мифах, где фигурирует Зевс, проявляется людус — любовь из спортивного интереса. Скорее даже просто влечение и желание завоевания, этакий «синдром охотника». Такой вид часто перетекает в современные романы под видом измен или коротких любовных связей. Именно после такого, главные героини книг стараются что-то изменить в своей жизни, потому что их просто завоевали, а не дали более глубокого чувства. Такое «путешествие» совершает, например, Эрин Брокович в одноимённом фильме. Разбитые мечты о жизни и любви приводят её к перевоплощению. Пускай такая любовь достаточно травмирующая, но она создаёт стимул для дальнейшего движения.</p>
    <p>Агапэ и сторге — это более мягкие виды, собственно, к которым часто стремятся люди. Эта любовь — самопожертвование, но не резким вызовом обществу, а скорее более незаметная. Некоторые люди могут её даже не заметить и принимать как должное. К этим видам любви человек часто приходит через эрос — эмоциональный страстный всплеск. Иногда эрос заканчивается на самом себе, как в «Ромео и Джульетте». Взбалмошная любовь, бросающая вызов обществу (как например, Роза и Джек из «Титаника», они тоже остались в точке эроса, хотя если бы не обстоятельства, вполне бы могли перейти на уровень выше). Эрос относится к тому виду, который часто показывают в современной литературе и кинематографе, потому что она более эмоциональная по своей сути. Это моменты первой взаимной влюбленности, желания.</p>
    <p>Филия, прагма и мания — интересные ответвления, также достаточно популярные, но всё же не совсем интересующие в данный момент, поскольку филия больше про дружескую любовь, прагма почти равняется расчёту, а мания скорее чем-то немного нездоровым. Поэтому я хотела бы поговорить только о четырёх описанных выше.</p>
    <p>В Древней Греции показывались, естественно, все виды. Но многие вспоминают мифы больше как страстную и завоевательную любовь. История Эроса и Психеи скорее является исключением, нежели правилом. А вот изменами, какими-то неправильными влечениями эта мифология запомнилась больше всего. Чего только стоит один миф о минотавре, который знает каждый, кто хоть раз бывал на Крите.</p>
    <p>В Средневековье большим упор делается на новое. Теперь это подвиги ради Принцесс, убийства драконов ради них же. Дама в беде становится очень популярной в историях прямиком из этого времени. Драконы, злобные отцы-короли, колдуньи — все они мешают воссоединению странника и принцессы. Любовь становится лучом надежды в тёмных временах Средних Веков.</p>
    <p>В эпоху Возрождения любовь становится запретной, ведь важнее взглянуть на разум человека, нежели на его чувства. Самым ярким примером является «Ромео и Джульетта». Взгляд на то, как запрет любви может быть губителен, потому что чувства и эмоции нельзя задвинуть на дальний план. Любовь всё также должна толкать на подвиги, как и в Средние века, но на сей раз немного по-новому. Эти подвиги должны быть направлены на развитие человечества. Поэтому любовь из обычной жизни перетекает в искусство, потому что так она не мешает прогрессу, но всё ещё остаётся достаточно важной в головах людей.</p>
    <p>Золотой и Серебрянный века возвращают любовь к чему-то возвышенному, несколько недостижимому. В поэзии часто можно встретить образы прекрасных дам, которые словно призраки скользят в жизнях поэтов, не дают им покоя. Именно при своей недостижимости они резко становится чем-то пугающей, как например, это видно у Ахматовой:</p>
    <blockquote>«Умеет так сладко рыдать<br>В молитве тоскующей скрипки,<br>И страшно её угадать<br>В еще незнакомой улыбке».</blockquote>
    <p>И если в литературе более старой любви-страдания было немного, то к XIX-XX веку она становится чуть ли не основной темой. Такую можно встретить не только в поэзии, можно вспомнить ту же самоотверженную любовь Сони Мармеладовой из «Преступления и наказания», когда она была готова ехать за любимым на каторгу, хотя тот не понимал ещё своих чувств. Разрушение с надеждой на воскрешение. Иногда и без этой надежды, поэтому этот период может показаться чуть более мрачным.</p>
    <p>В современности люди снова приходят к рассмотрению всех видов людей, всех её возможностей. Иногда не разделяя, где какая находится. Но если перекос и случается то идёт по двум путям: того же разрушения, что и в последние два века, или той самой воздушной и волшебной любви, о которой все мечтают. Скорее это происходит в силу постоянно разбивающихся сердец и желания обрести нечто более отдалённое и сказочное.</p>
    <p>Да, любовь в литературе часто отклоняется в ту или иную сторону, при этом люди в своих взаимоотношениях остаются теми же: влюбляются, теряют, тянутся, надеются и стараются обрести счастье. Любовь разная в видах, вопрос остаётся только в том, какой путь человек сам для себя хочет избрать: филию, эрос, агапэ, сторге, людус, манию, прагму. Но по сути, эти семь видов остаются неизменными с времён, когда любовь стала нечто большим, чем просто вопросом размножения. Любовь заставляет нас двигаться вперёд, даже если причиняет нам боль. Хотя если этой боли слишком много, то это уже не любовь, а что-то совершенно другое.</p>
    <p>Любовь едина, пускай и разнолика. Каждый век берёт себе то, что чувствует больше. Главное, только её не потерять.</p>

- tag: "Эссе"
  title: "Оказаться вдали от цивилизации и быть счастливым"
  excerpt: "История о том, как порой нужно оторваться от города, чтобы найти себя. Размышления о простоте и счастье."
  body: |
    <p>Оказаться вдали от цивилизации и быть счастливым Жили-были… Нет, погодите, так начинаются сказки, а мы в реальной жизни. «Я так больше не могу» — эта фраза становилась для Светы уже ежедневной мантрой. Каждое утро, вставая, собираясь и идя на электричку, она думала об этом. Солнце грело щёки, попадая на лицо сквозь листву деревьев. Потом из грязного окна электрички уже выученные наизусть пейзажи, казавшиеся мрачными. Путь до работы приводил в отчаяние. Красный диплом биолога в тумбочке спальни каждый раз обжигал своим существованием. Получить его, чтобы потом безвылазно сидеть в лаборатории… И как назло, двоюродная сестра с Алтая пару дней назад присылала фотографии с невероятными видами, со своей пасекой. Выглядела она на них невероятно счастливой. Звала к себе.</p>
    <p>Взять бы отпуск и поехать туда. Очистить лёгкие от мегаполисной пыли. «Я беру отпуск. За свой счёт» — наконец решилась сказать девушка.</p>
    <p>Заведующий был ошарашен. Сначала сопротивлялся и говорил, что без Светы никак. Но сдался под натиском аргументов, что они две недели без неё спокойно проживут. Через неделю жизнь сначала неуловимо, а потом кардинально изменится. Забронировать билеты, предупредить сестру, собрать вещи. Как сразу много дел набралось на эту неделю перед отъездом. «Какой здесь воздух… и жара!». Сестра быстро утащила Свету в машину — на таком солнце без крема можно было сгореть мгновенно. Горные пейзажи за окном кружили голову. Так начиналась её сельская жизнь. Человека, который всегда был далёк от пчеловодства. И человека, который думал, что проведёт всю жизнь в Москве. «Хочется остаться здесь». Первую неделю Света отдыхала. Наслаждалась горным воздухом, мерным жужжанием пчёл. Впервые за пару лет пригодились права: она брала машину сестры и выезжала в город. За покупками, да и побродить по новым местам. Она пыталась собрать как можно больше пыльцы для мёда воспоминаний. Сестра иногда оставляла пасеку на мужа с детьми и старалась устроить что-то вроде экскурсий. У неё даже интересно получалось.</p>
    <p>Когда они возвращались, Света бродила по ферме в сумерках, слушала природу.</p>
    <p>С каждым днём было тяжелее принять, что придётся вернуться в мегаполис. «Но я же совсем не знаю, что делать!». Когда сестра заметила, как Света завороженно наблюдает за пчёлами, предложила, чтоб она помогла. Обещала показать, как делать ежедневные вещи, а если увлечётся, то они что-нибудь придумают. И Света увлеклась. До отъезда оставалось два дня. Услышав, что</p>
    <p>семья не отказалась от помощницы, внутренне решение она уже приняла. Хотя сама ещё не до конца призналась себе в этом. «Кажется, я нашла дело жизни». Два месяца перекройки жизни прошли словно в тумане. Она постепенно подготавливала всё к своему отъезду, проходила курс по производству натурального мёда и становилась счастливее только от самих перемен. Небольших накоплений хватило только на перелёт, и на месяц жизни на ферме. Но Света стала полноценной помощницей, хоть и не знала всех тонкостей. Она изучала материалы, следила за обновлениями школы и становилась специалистом уже в этом направлении.</p>
    <p>Света нашла новый интересный путь. Возможно, Вам такое тоже понравится?</p>
    <p>Источник фотографий: stocksy.com, kiera oukrop</p>

- tag: "Подборка"
  title: "Подборка книг 12/25"
  excerpt: "Редакционная подборка из 8 новых книг от зарубежных и российских авторов для тех, кто хочет спрятаться от учёбы в текстах."
  body: |
    <p>Спрятаться от учёбы в текстах Когда в твоей жизни учёба занимает почти всё время, иногда хочется ненадолго отключиться от проектов и дедлайнов. А даже если не хочется, то переключить свою голову на что-то новое – полезно. Поэтому редакция собрала для вас новенькие 8 книг от зарубежных и российских авторов, которые помогут отвлечься от забот и погрузиться в другие, но не менее интересные миры.</p>
    <p>Дитя Афины – Ханна Линн Зачарованные мифами древних цивилизаций мы постоянно зачитываемся то первоисточником, то новым переложением. “Дитя Афины” – про второе. Это яркий и динамичный, а главное, немного освежённый взгляд на бывшую прекрасную жрицу, ставшую чудовищем в глазах людей. Что если взглянуть на старую историю слегка по-другому? Возможно, тогда мнение повернется в абсолютно противоположную сторону. Кто знает, вдруг чудовище – это жертва, а герой оказывается жестоким убийцей. Почему это произошло и как боги могли это допустить… Так или иначе, полную историю ты узнаешь, только взяв завораживающе сказочный томик в руки.</p>
    <p>История не очень длинная, зато увлекательная. При большом желании сможете осилить её за один-два дня.</p>
    <p>Когда порвётся нить – Никки Эрлик Иногда мы задумываемся “а сколько мне осталось?”, но вряд ли хочется узнать ответ на этот вопрос на самом деле. Но одно весеннее утро даёт возможность раскрыть правду каждому человеку на планете. Вопрос в том, сколько людей откроет загадочную деревянную шкатулку, и что они будут с этой информацией делать. Когда наступают сложные времена, люди делятся на две части: с помощью искусства закапывают себя ещё глубже или же, что себя вытаскивают. Может показаться, что книга мрачная, но на самом деле, она задаёт тон надежды и веры в лучшее. Воодушевление и желание стремиться к чему-то – оказывается хорошей помощью. Так что, друг, если захочешь выйти из городка грусти, вспомни об этой книге, возможно, она тебе поможет.</p>
    <p>Вдребезги – Макс Фальк Мельком взглянув на эту книгу сначала можно случайно подумать, что это что-то связанное с Майором Громом. Если вы запутались также, как автор этой заметки, то придётся распутываться. Это совершенно другая история с новыми героями. Более того, это первая часть дилогии, поэтому в пока что необозримом будущем можно думать о продолжении. Восхождение по социальным слоям от работы в автомастерской до богатой жизни. По пути появится прекрасная девушка, новый приятель и множество проблем. Остается надеяться, что главный герой со всем разберётся (или оставит это на вторую часть, поэтому совет: не читайте не до конца изданные книги, а то вдруг обожжётесь). Роман отменно длинный, так что наслаждаться всеми перипетиями ты сможешь явно не одну ночь. Запасайся большой кружкой чая или кофе с печенюшками.</p>
    <p>Ненастье – Алексей Иванов Прочитав аннотацию “о ком, о чём”, хочется спросить: а так ли это мне нужно? И зачем вообще читать про какой-то 2008 год, какого-то водителя и бывшего солдата Афганистана, который устраивает беспорядки в родном городе. Но если всё же открыть первую страницу и начать… То всё понимаешь. Одиночество и несчастье, которые порой уже можно начать осязать, проступают и в этом романе. Открываются с разных сторон, рассматриваются. Главное: не поддаться ненастью и спрятаться в тёплом, но грустном одеяле, а понять, что в твоей жизни идёт не так и как это стоит исправить.</p>
    <p>Потому что иначе твоё настроение пойдёт такими же кривыми, как здание на обложке (кстати, это специальный проект, где с книгами Алексея Иванова работают совершенно разные художники и чувствующие романы по-разному). Исследуя страницы книги, можно найти и себя.</p>
    <p>Одинокое путешествие накануне зимы – Виктор Ремизов Специально для тех, кто не находит времени на большие романы, а ищет сборники рассказов. Уютные истории про природу и людей, про понимание себя и единение с миром. В “Ненастье” искал/а себя? Тут можно это спокойно продолжить. Только в чуть более мягкой форме. Потому что тут можно найти ещё и свободу. Свободу дышать полной грудью, отпустив проблемы. Нужно напоминать себе делать глубокие вдохи и выдохи. Поставь эту книгу на видное место – будет напоминать о природе, чистом воздухе и крике счастья, улетевшего в горы.</p>
    <p>Предупреждение: после этой книги можно захотеть сбежать от людей в одиночное путешествие.</p>
    <p>Квартира в Париже – Фоли Люси Смотрел/а ли ты “Достать ножи”? Если да, и оценка с твоего аккаунта кинопоиска была зелёной, то эта книга тебе должна понравиться. Загадочное исчезновение брата главной героини, недовольные обитатели дома, у которых шкафов на скелетов не хватит.</p>
    <p>Мистика, тайны, недовольные взгляды – всё сплетено в большой клубок, который нужно расплести. Получится ли тебе докопаться до правды быстрее Джесс? Начинайте делать ставки с друзьями книгоманами: кто окажется дальше всех от правильного ответа, тот печёт круассаны на всю компанию. А второй проигравший пускай варит кофе, как варят его в Париже. Игра начинается и для главной героини, и для вас. Только вторая игра гораздо безопаснее первой, поэтому можно порадоваться, что ты сейчас не перенесёшься в квартиру в Париже.</p>
    <p>Разрушенный мост – Филип Пулман Романы о взрослении… Хм, думаешь, что уже вырос/ла? А как же твой внутренний, недопонятный ребёнок? Он же тоже требует внимания, только взрослеть особо не собирается.</p>
    <p>Загадки семьи, разрушенные представления обо всём старом и привычном… С этим можно столкнуться и во взрослой жизни, нужно только быть к этому готовым. А тяга к искусству и приключениям, как у Джинни, есть у нас всех (мы студенты творческого колледжа, как иначе), так что следить за похожей девочкой будет</p>
    <p>ещё интереснее. Что она придумает, чтобы докопаться до сути и узнать правду? 288 страниц истории уже ждут твоего прочтения.</p>
    <p>Калипсо – Йонсруд Ингар “Квартиру в Париже” прочитали? Тогда можно двигаться дальше и глубже! В более страшные загадки. Погрузиться в историю двадцатилетней давности и новое, свежее дело. Кажется, полицейскому придётся изрядно постараться, чтобы найти виновного в этой истории.</p>
    <p>Понять психологию действий, отыскать потерянного человека, обнаружить причину мести и собрать всё в единое и стройное дело. Нужно ещё сделать так, чтобы общество не слишком бурно среагировало на инцидент. Слишком много всего нужно решить. Можно пожелать главному инспектору Фредерику Байеру успехов в улаживании столь сложных дел и удачи тебе, дорогой читатель, чтобы история оказалась действительно захватывающей и заставляющей подумать над разгадкой.</p>

- tag: "Гид"
  title: "Полезное самообразование: куда сходить с друзьями"
  excerpt: "Лайфстайл-гид по Москве: музеи, мероприятия и необычные места вне классического списка Третьяковка — Пушкинский — Дарвиновский."
  body: |
    <p>Полезное самообразование: куда можно сходить с друзьями Минус такого мегаполиса, как Москва: интересных мероприятий столько, что листать списки Афиши можно до бесконечности. А музеи классического списка: Третьяковка, Пушкинский и Дарвиновский – уже истоптаны… Срочно нужно что-то новое.</p>
    <p>Отобрали самое интересное: от мультимедийных выставок до концерта Zoloto.</p>
    <p>Центр дизайна Artplay Придя на казалось бы одну выставку, ты получаешь билет в сказочное путешествие в миры нескольких художников. В декабре можно погрузиться в миры российского художника ZORIKTO, работающим со всевозможными техниками и объединяющим их в своих работах. Уютные, будто кочевнические работы ненадолго выведут тебя из собственных проблем и тяжелых мыслей. Можно будет прочувствовать атмосферу, погрузившись в народную музыку Бурятии.</p>
    <p>А после этого оказаться в совершенно другой реальности мультимедийной выставки “Фрида. Viva la vida!”. Прожить годы Фриды Кало вместе с ней, ощутить себя в теле и переживаниях художницы. Вы сможете посетить эти выставки даже прямо перед Новым годом.</p>
    <p>Выставка “Сансара 2.0” от ZORIKTO продлится до 31 декабря, а “Фрида. Viva la vida!” до 29 января.</p>
    <p>Кстати, это недалеко от колледжа. Всего полчаса на метро до станции “Курская” и пятнадцать минут до центра дизайна.</p>
    <p>Единый билет на выставку сможете купить за 750 рублей на Яндекс.Афише.</p>
    <p>Дягилев. Генеральная репетиция Когда заходит разговор о хореографии, трудно представить себе, что её можно как-то закрепить на музейных стенах.</p>
    <p>Ведь суть танца — в движении и эмоциях исполнителей. Но всё же… представить можно и нужно. Новая Третьяковка уже распахнула свои двери и ждёт всех фанатов балета (и не только! Вдруг ты только начинаешь интересоваться искусством танца. Это прекрасное начало пути). Эскизы костюмов и декораций; видеозаписи первых и обновленных постановок; сами костюмы, в которых выступали танцоры – всё это вы найдёте в залах выставки. Не забудь взять аудиогид, так гораздо интереснее.</p>
    <p>Залы Дягилева уже ждут тебя в основном крыле Новой Третьяковки. Времени на посещение у тебя с друзьями достаточно: выставка продлится до 5 февраля 2023-го (после этого выставку переделают в новую и более масштабную экспозицию).</p>
    <p>Билет по студенческому выйдет всего в 350 рублей. Re: Ренессанс. Егор Остров Образ, дух, красота – девиз этой выставки. Масштабные итоги работы на протяжении тридцати лет. Художник, который перерабатывает хаос двадцатого века в новое видение современности. Отсылки к классическому искусству и нечто обновленное. Если ты только из Третьяковской галереи с её постоянной экспозицией, то это интересная</p>
    <p>возможность перейти к современному искусству (однако сам Остров уточняет, что работает в этернаизме – вечном искусстве, без каких-либо рамок). Можно будет увидеть знакомые образы, спрятанные в складках одежд старинных героев.</p>
    <p>Поспеши, иначе не успеешь увидеть что-то неслыханное. Выставка закроется 11 декабря.</p>
    <p>А до того времени приезжай в выставочные залы РОСИЗО на “Китай-городе” с билетом за 200 рублей и наслаждайся искусством.</p>
    <p>Пол Брунс. Голландская палитра Абстрактная архитектура в фотографии. Кажется, на этой выставке объединилось несколько факультетов нашего колледжа. Но интересно будет не только фотографам, архитекторам и дизайнерам. Это первая персональная выставка Пола Брунса. Нужно будет погрузиться в новый и нереальный город чудесатой геометрии, симметрии и цвета. Смотри, только не заблудись в лабиринтах больших домов, которые запечатлел фотограф. Но галерея всё предусмотрела: ты сможешь побродить по залам вместе с куратором выставки на экскурсии и послушать много интересных историй про эти работы (и не только про них, тебя проведут ещё по постоянной экспозиции и расскажут о правилах работы с фотографией).</p>
    <p>Возможно, ты вдохновишься и создашь собственный город из улиц и домов Москвы? Изучай города вместе с известным художником, это обязательно нужно увидеть.</p>
    <p>Выставка ждёт тебя в галерее “Люмьер” на Добрынинской/Серпуховской – буквально в десяти минутах ходьбы. Она продлится до 26 февраля 2023-го.</p>
    <p>Стоимость билета с экскурсией: 2000 рублей. Врата времени А на этой выставке вы погрузитесь в творчество не одного, а четырёх художников.</p>
    <p>Один из них, кстати, преподавательница МКИК – Кира Мрик, вы должны быть знакомы. Если в твоей голове роились мысли о путешествиях во времени, то тебе точно туда. Оказаться можно будет не только в будущее, но и оказаться в прошлом.</p>
    <p>Получается, двойной портал. Разные стили работ позволят взглянуть на время под разными углами, рассмотреть и почувствовать его как следует. Главное, чтобы у тебя не болела шея, работы висят высоко – или можно будет посмотреть на картины с высоты красивой кованой лестницы, тогда шею напрягать не придётся. Кстати, если вы с друзьями проголодались, эта выставка для вас – прекрасный вариант, ведь “Квартира S” находится в арт-пространстве рынка на Ленинском, и еды там всяческое множество (заодно попробуешь несколько кухонь мира).</p>
    <p>Только приезжай скорее, выставка закроется 12 декабря (но после этого кураторы работы точно устроят что-то новое интересное, так что отметь место на своей карте).</p>
    <p>До галереи придётся прогуляться 10 минут от метро “Новаторская” – это БКЛ – или от красной ветки и станции “Проспект Вернадского”.</p>
    <p>Зато вход совершенно свободный, наслаждайся искусством бесплатно.</p>
    <p>Анна Титова. Удивительное путешествие озорника</p>
    <p>Если вы с друзьями уже видели постоянную экспозицию музея Вадима Сидура и думаете, что больше ничего интересного там не будет – кажется, всё-таки что-то новое там точно найдётся. Теперь в обновленной экспозиции можно будет взглянуть на длительное исследование Анны Титовой насчёт того, как и в чём в современном городе проявляются связи между людьми. Изучение утопических произведений, истории России привело к некоторому пониманию Москвы и её жителей. Анна рассмотрела, как жёсткий иерархический строй постепенно перешёл в более мягкое взаимодействие людей. И всё это – в скульптуре. Сама выставка построена таким образом, чтобы взглянуть по-новому не только на город, историю и населяющих его людей, но и на современное искусство в целом. Экспозиция предполагает под себя не строгое восприятие, а возможность полёта мысли и философствования.</p>
    <p>До выставки ты сможешь добраться от метро “Перово”, идти 10 минут.</p>
    <p>А билеты стоят всего ничего, по студенческому – всего 50 рублей.</p>
    <p>Zoloto: на афтепати не должно быть грустно По выставкам прошлись, шея затекла поворачиваться туда-сюда, а голова устала искать новые смыслы. Классный вариант, чтобы получить заряд эмоций и, возможно, новой энергии: сходить на концерт. Современное искусство царит и в звучании классических семи нот. На это мероприятие точно нужно захватить друзья – вместе на танцполе можно будет подпевать во всю силу своих связок (не забудь, что случайно можешь так сорвать голос и будь осторожнее). Можно будет подпитаться ся любовью от всех людей, что там будут танцевать вместе с тобой и увидеть любимого исполнителя – если про Zoloto слышишь впервые, то совет от автора статьи: послушать песню “Тянет”, а потом втянуться так, что без этого музыканта уже будет никак. Заряди телефон, снимай, радуйся, чувствуй!</p>
    <p>Концерт пройдет в Adrenaline Stadium (это метро “Сокол”) 18-го декабря в 20:00.</p>
    <p>Не купили с друзьями билеты? Срочно проверяй остались ли они! Танцпол заберет у тебя 1700 рублей, ВИП-места стартуют от 3500 рублей – выбирай, что больше нравится тебе и твоему кошельку.</p>
    <p>Le Тартюф Для фанатов экспериментов и новых ощущений – комедия “Le Тартюф”. Французский фарс и жанр комедии перевернуты с ног на голову, всё странно, непонятно, но зато очень ярко. Хороший способ глотнуть свежего воздуха в казалось бы закрытом помещении. Взаимодействие со зрителями (о нет, они разрушили четвёртую стену!), совместные размышления и переосмысления пьесы, которая была написана ещё в 17 веке. Если в твою голову срочно нужно что-то яркое, позитивное и выталкивающие все проблемы подальше – тогда вперёд на поиски возвышенного смысла комедии вместе с режиссёром и актёрами.</p>
    <p>Ищите в театре на Таганке (в двух шагах от метро “Таганка”) 27-го и 28-го декабря в 19:00.</p>
    <p>Билеты от 1000 до 7000 рублей. Выбирай места, что больше нравятся. Кстати, возможно, на твоей пушкинской карте остались баллы, проверь обязательно, ведь 1-го января, как в “Золушке”, они обнулятся! Будет обидно, так что не забудь.</p>

- tag: "Кино"
  title: "Почему Уэс Андерсон стал самым известным режиссёром авторского кино XXI века"
  excerpt: "Киноведческий текст об уникальном стиле режиссёра, симметрии, палитре и почему его фильмы запоминаются навсегда."
  body: |
    <p>Почему Уэс Андерсон стал самым известным режиссёром авторского кино XXI века Уэс Андерсон – режиссёр, известный большинству по фильму «Отель «Гранд Будапешт».</p>
    <p>Кинолента занимает 71 место в списке «1000 самых известных фильмов» по статистике Кинопоиска. На одну отрицательную рецензию приходится тридцать восторженных. А на показах картина собрала в семь раз больше бюджета. И многие зрители, познакомившиеся с фильмом в 2014-ом, остались фанатами режиссёра и теперь ждут его каждого нового фильма.</p>
    <p>На первый взгляд работы Андерсона кажутся бессюжетными, бессмысленными. Если читать рецензии на его фильмы, то 9 из 10 негативных отзывов именно про отсутствие сюжета. Но это совершенно не так, просто стоит взглянуть на историю под другим углом. Давайте разбираться, как Уэс Андерсон он взобрался на одну из вершин сюрреалистической комедии и сумел покорить массового зрителя авторским кино. «Я не думаю, что кто-либо из нас является нормальным человеком». Казалось бы, семья у Уэса была самой обычной: отец работал в рекламном агенте, а мать от археологии ушла в агенты недвижимости. В восемь лет мальчику и его братьям пришлось пережить развод родителей. И как это часто бывает, такое событие стало одним из основополагающих его будущего. Позже история легла в основу фильма «Семейка Тененбаум». Сам Андерсон в интервью говорил, что уже тогда он хотел стать писателем, поэтому собирал в свою копилку памяти даже грустные воспоминания. Писательскую мечту он не оставлял до университета, хотя и поступил на философский факультет. Но это решение было невероятно удачным для его режиссёрской карьеры, потому что там он познакомился с братьями Уилсон. С Оуэном они написали сценарий для первого фильма «Бутылочная ракета». Конечно же, двум студентам не хватало денег на съёмки полнометражки, поэтому они ограничились хронометражем в 13 минут. «Не тяните из нас жилы, это какой-то гребаный кошмар, чтоб меня черти драли, объясните нахрен, в чём дело?!». Короткометражка впечатлила критиков и попалась под руку одному известному продюсеру Джеймсу Л. Бруксу (он работал над «Симпсонами», «Джерри Магуайер», «Большой» и «Лучше не бывает»). Фактически, Уэсу и Оэну невероятно повезло, потому что они смогли зацепить внимание профессионала, который ещё и сам предложил доработать историю и снять полнометражную версию. Однако в этот раз везение решило на некоторое время друзей покинуть – фильм провалился в прокате. Для Андерсона это было сродни концу света. С конкурсными программами тоже всё пролетело. Надежду вернула награда MTV за лучший режиссёрский дебют. Но неприятие фильма зрителями Уэса совершенно не остановило, он решил, что нужно работать дальше и придумывать новые истории вне зависимости от общего одобрения. Вознаграждение за такую настойчивость не заставило себя ждать: агент Билла Мюррея был восхищён работой Андерсона и получил сценарий «Академии Рашмор», который и передал актёру. Тот заинтересовался и решил поучаствовать в проекте. «Если один человек получил шанс прожить удивительную жизнь, он не может сделать это в одиночестве». Удивительно, но Билл Мюррей и Уэс Андерсон настолько сработались за «Академию», что стали постоянным тандемом. В этом фильме авторский режиссёрский стиль ещё не разработался, он мог читаться, но только лёгким намёком. Всего вторая работа уже смогла привлечь внимание, но ненадолго. Зрители почти тут же забыли о существовании и фильма и режиссёра. Именно в это время и ближайшие десять лет Уэс выпускал свои ленты раз в три года, поэтому поддерживать популярность не получалось. Известность принесла «Семейка Тененбаум», которая показалась зрителю гораздо искреннее и эстетичнее двух предыдущих фильмов. Здесь уже и авторская симметрия, и сказочность, и довольно</p>
    <p>популярный актёрский состав. Именно с этого фильма можно начинать первичную популярность Андерсона у людей. «Семейка» взяла номинацию на премию «Оскар», но лауреатом так и не стала. Уже по первым трём фильмам видны американские горки, на которых катается режиссёр всю свою профессиональную жизнь. Но дальше – только хлеще. «Я не бросаю себе вызов — я жажду приключений. Ну и хочу рассказать хорошую историю, конечно». Лозунгом историй можно назвать «без повторов». Именно поэтому два новых фильма повернули на новые тропинки. Дорожки оказались очень скользкими и заросшими, а расчистить их для американского зрителя совершенно не получилось. Поэтому «Водная жизнь» и «Поезд на Дарджилинг» совершенно не окупили потраченных бюджетов – сборы не получили даже половины от планов. Вопрос скорее был именно в истории: с «Водной жизнью» случилось опоздание, потому что популярность Жака Ива Кусто осталась в прошлом столетии. А вот с «Поездом на Дарджилинг» режиссёр побежал немного вперёд с тягой к Индии (возможно, фильм стал бы более успешным где-нибудь в 2020-ом, когда весь кинематограф повернулся на восток). При этом авторский стиль теперь угадывался с первых кадров: идеальная «взрослая» сказочность и собраннаяя цветовая гамма выделяли фильмы среди тысяч других фильмов, которые выходили в этих годах. С точки зрения всего кинематографа провалы провалами назвать достаточно сложно, потому что рейтинг у них всё равно оказывается выше среднего: 7.2 по кинопоиску. «Искупление? Конечно». После провальных шести лет нужно было срочно возвращаться в строй. И тут Андерсон решил показать себя с совершенно новой стороны. Он начал работать не только на взрослую аудиторию, потому что появляется «Бесподобный мистер Фокс».</p>
    <p>Интересен этот мультфильм не только фирменным стилем и интересной историей, но ещё и формой анимации – кукольная анимация в 2000-х успела забыться, поэтому вызвала неподдельный интерес публики. Но Андерсон всё также работает с поиском себя в этом мире, постоянным одиночеством и отличием главного героя от остальных. Именно эти вопросы интересуют каждого человека: и осознанно, и нет. Высказываясь об этих вопросах в очень красивой форме, режиссёру удаётся привлечь большую аудиторию. «Ваша репутация опережает вас». Наступает 2012-й и 2014-й годы, взрывающие карьеру Андерсона. «Королевство полной луны» и «Отель «Гранд Будапешт» становятся самыми кассовыми фильмами. Теперь не только Америка и часть Европы узнают о творчестве режиссёра, но и весь остальной мир. Звёздность актёрского состава выросла в несколько раз, хотя бюджеты остались в рамках прошлых. Благодаря этому провальность предыдущих проектов сразу окупилась. Казалось бы, истории любви и сумасбродного путешествия двух друзей уже никого не должно удивлять. Но свежий взгляд Андерсона, который рассказывает эти истории одновременно и с банальной стороны, и со своей авторской. В первой истории дети гораздо мудрее и взрослее взрослых, а во второй сюжетом движет нелепая случайность.</p>
    <p>Для искушённого зрителя такие приёмы в первую минуту кажутся клишированными, но принимая правила игры, они становятся оправданными и в чём-то оригинальными. В этом и проявляется исключительность Андерсона: он рассказывает что-то обыденное так, что оно становится новым и невероятно интересным. «Мои друзья думают, что я люблю драться, но это неправда». Есть ещё одна привлекающая черта: режиссёр ни с кем не конкурирует. Уэс не гонится за премиями и на публике никогда не говорит о своих сожалениях, что номинации не срабатывают. Вокруг него никогда не было скандалов. Поэтому искренность работ никогда не подвергается сомнению – детское повествование не контрастирует с личностью режиссёра. Так зритель доверяет истории.</p>
    <p>Печальный «Остров собак» воспринимается ещё более ярко, поскольку идеально попадает в</p>
    <p>современную повестку. «Французский вестник…» же чувствуется более эстетичным взглядом на реальность без основной мысли. «Не грызитесь… Займитесь любовью». Андерсон работает в направлении эстетизма, примерно также как когда-то работал Оскар Уайльд, Данте Габриель Россетти и Стефан Малларме. «Существует, потому что красиво». Именно поэтому форма преобладает над содержанием, хотя его не исключает. Вероятно, основной проблемой для зрителей является соглашение с его правилами игры. Потому что если их принять и полностью подчиняться, то работы Уэса не будут вызывать сильного отторжения, скорее только просто ответ «не в моём вкусе». Этот режиссёр пускай и затрагивает экзистенциальные вопросы, но делает это комфортно и даёт зрителю отвлечься от постоянных реальных проблем. В этом прячется секрет его успешности именно в массовом кинематографе. «Я не храбрый. Просто я был не в настроении всех разочаровывать». Сейчас основная загадка Андерсона кроется в том, сможет ли он создать что-то сильнее «Отеля «Гранд Будапешт» и не начнёт ли он повторяться. Потому что тогда есть возможность потерять аудиторию даже при всех достоинствах его творчества. Один из немногих эстетов XXI века должен придумать нечто новое, чтобы снова подняться на Олимп кинематографа. Но даже если этого не произойдёт, то в любом случае искусство, созданное Уэсом Андерсоном тронуло сердца миллионов людей: оно заставляет их искать эстетику в обычной жизни и придумывать что-то такое же сумасбродное, но невероятно интересное. Это режиссёр, который наверняка останется в истории кинематографа, как странная и неоднозначная личность.</p>

- tag: "Интервью"
  title: "Художники и пиратство"
  excerpt: "Интервью с digital-художницей о воровстве контента в интернете. Как авторы борются с теми, кто присваивает чужое творчество."
  body: |
    <p>Авторы VS Пираты. Легендарная битва Лихое пиратство из XV века приплыло сквозь океаны времени к нам. С интернетом воровство контента стало более частым. С этим сталкиваются авторы любого контента. Саша – диджитал художница и не раз видела свои работы, выложенные «пиратами». Мы поговорили с Сашей и узнали, что она делает в таких случаях.</p>
    <p>Саша, ты долго выкладывала свои арты в свободный доступ. Часто встречала работы под чужим авторством? — Сначала я не знала, но мне начали рассказывать об этом друзья. Скидывали ссылки. Обычно люди не указывали авторство. Поэтому я всегда оставляла подпись как часть арта.</p>
    <p>Тебя сильно это расстраивало? — Я не устраивала скандалы. Писала ребятам, которые вели соц.сети от моего имени. Но они всегда извинялись. Позже в шапках аккаунтов писали, что аккаунт фанатский и указывали мои настоящие соц.сети.</p>
    <p>Сейчас ты на этом зарабатываешь. Повлияло ли это на частоту пиратства? — Очень сильно. Я просто перестала выкладывать работы в открытый доступ.</p>
    <p>Теперь взаимодействую исключительно заказчик-я. И не было никаких неприятных ситуаций с этим контентом? — Один раз. Я рисовала по известным фильмам, поэтому фанаты были из разных стран. Как-то я заметила аккаунт в инстаграме* (принадлежит компании Meta, признанной экстремистской в России), его вёл мексиканец. Там были мои арты с затёртой подписью.</p>
    <p>Ты пожаловалась на аккаунт? Его заблокировали? — Пришлось. Я не хотела его блокировать, но он недоброжелательно вёл себя в переписке и больше ничего сделать было нельзя. В первый раз обращение пропустили. Во второй написали из поддержки с просьбой подтвердить авторство. Я скинула файлы с указанием даты создания. Через пару недель его аккаунт заблокировали. Счастливый конец!</p>
    <p>Можешь ли ты что-то посоветовать людям, у которых украли контент? — Не вступайте в разговор со скандалом. Если Вы будете спокойными, то выше будет вероятность решить ситуацию мирно. Сохраняйте и датируйте файлы, так будет легче защищать своё авторство. Будьте доброжелательны, но внимательны.</p>

- tag: "Гид"
  title: "Чем занять ребёнка летом"
  excerpt: "Увлекательный план каникул для детей и родителей: как объединить безделье и полезные навыки, чтобы все остались довольны."
  body: |
    <p>Чем занять ребёнка летом В каникулы у детей, родители разделяются на два лагеря: «пускай побездельничает» и «надо научить ребёнка классным полезным навыкам». Но кто сказал, что эти два лагеря нельзя объединить? И нужно это попробовать.</p>
    <p>Поэтому составляем увлекательный план на лето, чтобы все остались довольны: родители и дети.</p>
    <p>Спросите ребёнка. Если думаете, что знаете своего ребёнка – проверьте.</p>
    <p>Узнайте, что недавно могло попасться на глаза интересного, что даже захотелось этим заняться. Может, сын видел мальчика, играющего на укулеле и захотел также. Или дочка наткнулась на видео с сёрфингом и теперь это её новая мечта.</p>
    <p>Если конкретики нет, спросите, чего хочется из мелочей: полежать под звёздами или приготовить морковный торт. Из таких занятий можно уловить, что ребёнка привлекает больше всего.</p>
    <p>Сходите в игровой центр. В крупных городах стали появляться точки, где ребёнок в игре может попробовать десятки профессий, а Вы поймёте, в каком направлении двигаться — это хорошая возможность понять, что подсознательно выберет ребёнок. Такие места бывают не только закрытыми: летом проводятся фестивали, где можно попробовать и привычные, и этнические профессии. День на свежем воздухе с интересными занятиями принесёт пользу и воспоминания.</p>
    <p>Пробуйте вместе. После детективного расследования приступаем к делу.</p>
    <p>Можно записать ребёнка на курсы в том направлении, которое привлекло больше всего. Если он чего-то не пробовал или «не распробовал» до конца, а Вам это интересно, предложите позаниматься всей семьёй. Кто знает, вдруг через пару месяцев вы станете династией программистов-любителей.</p>
    <p>Разбудите в нём жилку бизнесменства. Вы хотели сделать красивую презентацию, а ваш подросший ребёнок просит всё больше карманных денег.</p>
    <p>Предложите сделку: вам презентация – ему навыки и прибавка к карманным. В конце концов к старшим классам и ВУЗу навык будет полезнее некуда. Или всё то же самое, только с веб-программированием. Научиться делать презентации и сайты ребёнок сможет с нами.​</p>
