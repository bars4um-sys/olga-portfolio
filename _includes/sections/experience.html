<section class="experience" id="experience">
    <div class="container">
        <div class="section-header section-header--fullwidth">
            <span class="section-label">02</span>
            <h2 class="section-title">Опыт работы</h2>
            <div class="section-line"></div>
        </div>

        <div class="timeline">
            <div class="timeline-line"></div>

            {% for job in site.data.experience %}
            <article class="timeline-item">
                <div class="timeline-dot"></div>
                <div class="timeline-card">
                    <div class="timeline-meta">
                        <span class="timeline-period">{{ job.period }}</span>
                        <span class="timeline-duration">{{ job.duration }}</span>
                    </div>
                    <h3 class="timeline-company">{{ job.company }}</h3>
                    <p class="timeline-role">{{ job.role }}</p>
                    <ul class="timeline-tasks">
                        {% for task in job.tasks %}
                        <li>{{ task }}</li>
                        {% endfor %}
                    </ul>
                </div>
            </article>
            {% endfor %}
        </div>
    </div>
</section>

<!-- Torn Paper Divider -->
<div class="torn-paper torn-paper--down"></div>
