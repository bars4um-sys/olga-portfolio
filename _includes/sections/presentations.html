<section class="presentations" id="presentations">
    <div class="container">
        <div class="section-header">
            <span class="section-label">05</span>
            <h2 class="section-title">Презентации</h2>
        </div>

        <div class="presentations-grid">
            {% for pres in site.data.presentations %}
            <article class="presentation-card">
                <div class="presentation-icon">
                    {{ pres.icon }}
                </div>
                <h3 class="presentation-title">{{ pres.title }}</h3>
                <a href="{{ pres.file | relative_url }}" class="presentation-link" target="_blank" rel="noopener">Открыть PDF →</a>
            </article>
            {% endfor %}
        </div>
    </div>
</section>

<!-- Torn Paper Divider -->
<div class="torn-paper torn-paper--up"></div>
